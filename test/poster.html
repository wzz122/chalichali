<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>茶里茶里 モバイルオーダー 二维码</title>
<style id="pagesize">@page { size: A5 portrait; margin: 0; }</style>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #E9ECE9; color: #1F2A24; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "PingFang SC", "PingFang HK", "Apple SD Gothic Neo", "Noto Sans JP", "Noto Sans SC", "Noto Sans KR", sans-serif; }
  .tools { max-width: 297mm; margin: 16px auto; padding: 0 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 15px; }
  .tools input { width: 90px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid rgba(0, 0, 0, 0.15); font: inherit; }
  .tools button { padding: 9px 16px; border-radius: 10px; border: 0; background: #2E7D4F; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
  .tools select { padding: 8px 10px; border-radius: 10px; border: 1.5px solid rgba(0, 0, 0, 0.15); font: inherit; }
  .tools label { display: flex; gap: 6px; align-items: center; }
  .tools span { color: #6B746F; font-size: 13px; flex-basis: 100%; }
  .pages { overflow-x: auto; padding: 0 16px 24px; }   /* 屏幕比 A4 窄时可以左右滑，不会切掉左边 */
  .page { display: flex; width: fit-content; margin: 0 auto 24px; background: #fff; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12); }
  .page.a4 .sheet + .sheet { border-left: 0.3mm dashed #C9CFCB; }   /* A4 横放两张，中间是剪开的线 */

  .sheet {
    width: 148mm; height: 210mm; background: #fff; padding: 11mm 11mm 8mm;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .brand { font-size: 12mm; font-weight: 900; color: #2E7D4F; letter-spacing: 1mm; line-height: 1.1; }
  .title { margin-top: 1.5mm; font-size: 7.5mm; font-weight: 900; }
  .title small { display: block; font-size: 3.8mm; font-weight: 700; color: #6B746F; margin-top: 0.5mm; }
  .where { margin-top: 3mm; width: 100%; border-radius: 4mm; padding: 2.5mm 4mm; color: #fff; background: #2E7D4F; }
  .where b { display: block; font-size: 7.5mm; font-weight: 900; line-height: 1.2; }
  .where small { display: block; font-size: 3.4mm; font-weight: 700; opacity: 0.95; line-height: 1.35; }
  .sheet.takeOut .where { background: #E07B39; }
  .sheet.takeOut .qr { border-color: #E07B39; }
  .queue { margin-top: 2mm; background: #FFF1C2; color: #7A5B00; border-radius: 3mm; padding: 1.5mm 5mm; font-size: 4mm; font-weight: 900; line-height: 1.35; }
  .queue small { display: block; font-size: 3mm; font-weight: 700; }
  .qr { margin-top: 4mm; width: 70mm; height: 70mm; padding: 3mm; border: 1.2mm solid #2E7D4F; border-radius: 6mm; flex: none; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .langs { margin-top: 3mm; font-size: 3.6mm; font-weight: 800; color: #2E7D4F; }
  .steps { margin-top: 3mm; width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.5mm; }
  .step { background: #F2F4F1; border-radius: 4mm; padding: 2.5mm 1.5mm; }
  .step b { display: block; font-size: 5.5mm; color: #2E7D4F; line-height: 1.1; }
  .step div { font-size: 3.4mm; font-weight: 800; line-height: 1.35; }
  .step small { display: block; font-size: 2.7mm; color: #6B746F; font-weight: 600; margin-top: 0.8mm; line-height: 1.3; }
  .testmark { margin-top: 2mm; font-size: 3.6mm; font-weight: 900; color: #C62828; border: 0.5mm solid #C62828; border-radius: 2mm; padding: 0.5mm 3mm; }
  .url { margin-top: auto; font-size: 2.6mm; color: #9AA19D; word-break: break-all; }
  @media print {
    html, body { background: #fff; }
    .tools { display: none; }
    .pages { padding: 0; overflow: visible; }
    .page { box-shadow: none; margin: 0; break-after: page; }
    .page:last-child { break-after: auto; }
  }
</style>
</head>
<body>
<div class="tools">
  <select id="kind">
    <option value="set">一整套：桌子 + 前台</option>
    <option value="table">一张桌子</option>
    <option value="counter">前台（外带，做好来取）</option>
    <option value="queue">排队用（外带）</option>
  </select>
  <label id="seatBox">桌号 <input id="seat" maxlength="10"></label>
  <label id="tablesBox">桌子数 <input id="tables" type="number" min="1" max="30"></label>
  <select id="paper"><option value="a4">A4 横放，一张印两份（剪开）</option><option value="a5">A5，一张一份</option></select>
  <button onclick="window.print()">打印</button>
  <span>桌子上的二维码带桌号：顾客点的是「店内」，接单屏上写「店内 · 桌 1」，Waiter 里点「テーブル 1」。前台的二维码不带桌号：点的是「外带」，做好到柜台取。打印时选「实际大小 / 100%」。</span>
</div>
<div class="pages" id="pages"></div>

<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
"use strict";
const CONFIG = window.CHALI_CONFIG || {};
const params = new URLSearchParams(location.search);
// 顾客页面地址：config.js 里写了 orderUrl 就用它，否则用和这个页面同一个目录
const BASE = CONFIG.orderUrl || new URL("./", location.href).href;
// 测试网址的二维码打开的是测试点单页：海报上标出来，免得和正式的混在一起
const TEST = /\/test\/$/.test(new URL(BASE).pathname);
const $ = (id) => document.getElementById(id);

$("kind").value = ["set", "table", "counter", "queue"].includes(params.get("k")) ? params.get("k") : params.get("t") ? "table" : "set";
$("seat").value = params.get("t") || "1";
$("tables").value = params.get("n") || CONFIG.tables || 3;
$("paper").value = params.get("paper") === "a5" ? "a5" : "a4";

function el(tag, cls, ...children) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const c of children) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function lines(...texts) { const f = document.createDocumentFragment(); texts.forEach((x, i) => { if (i) f.append(document.createElement("br")); f.append(x); }); return f; }

// 一张海报：seat 有值 = 桌子（店内），没有 = 前台（外带）；queue = 排队的地方
function sheet(seat, queue) {
  const url = new URL(BASE);
  if (seat) url.searchParams.set("t", seat);
  const qr = qrcode(0, "M");
  qr.addData(url.href);
  qr.make();
  const qrBox = el("div", "qr");
  qrBox.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });

  const where = seat
    ? el("div", "where", el("b", null, "テーブル " + seat + " · 桌 " + seat + " · Table " + seat),
        el("small", null, "店内でお召し上がり · 店内用 · 堂食 · 매장 이용 · Eat in · В заведении"))
    : el("div", "where", el("b", null, "お持ち帰り · 外带 · Take out"),
        el("small", null, "できあがったらカウンターでお受け取り · 做好后到柜台取 · 整好喺櫃位攞"),
        el("small", null, "준비되면 카운터에서 픽업 · Pick up at the counter · Заберите на кассе"));
  return el("div", "sheet " + (seat ? "eatIn" : "takeOut"),
    el("div", "brand", "茶里茶里"),
    el("div", "title", "モバイルオーダー", el("small", null, "扫码点单 · 掃碼落單 · 모바일 주문 · Mobile Order · Заказ с телефона")),
    where,
    queue ? el("div", "queue", "並んでいる間にスマホで注文できます", el("small", null, "排队时可以先扫码点单 · Order on your phone while you wait")) : null,
    qrBox,
    el("div", "langs", "🌐 日本語 · 简体中文 · 粵語 · 한국어 · English · Русский"),
    el("div", "steps",
      el("div", "step", el("b", null, "1"), el("div", null, "QRを読んで注文"), el("small", null, lines("扫码选饮品", "주문하기 · Scan & order", "Сканируйте и закажите"))),
      el("div", "step", el("b", null, "2"), el("div", null, "レジで番号を伝えてお支払い"), el("small", null, lines("到柜台报单号付款", "카운터에서 결제 · Pay at the counter", "Оплата на кассе"))),
      el("div", "step", el("b", null, "3"), el("div", null, "できあがりをスマホでお知らせ"), el("small", null, lines("手机提示后到柜台取", "완성되면 픽업 · Pick up when ready", "Заберите, когда готово"))),
    ),
    TEST ? el("div", "testmark", "测试用 · TEST") : null,
    el("div", "url", url.href),
  );
}

function draw() {
  const kind = $("kind").value;
  const a4 = $("paper").value === "a4";
  $("seatBox").hidden = kind !== "table";
  $("tablesBox").hidden = kind !== "set";
  let sheets;
  if (kind === "set") {
    const n = Math.max(1, Math.min(30, parseInt($("tables").value, 10) || 3));
    sheets = Array.from({ length: n }, (_, i) => sheet(String(i + 1))).concat(sheet(""));
  } else if (kind === "table") {
    sheets = [sheet($("seat").value.trim() || "1")];
  } else {
    sheets = [sheet("", kind === "queue")];
  }
  $("pagesize").textContent = "@page { size: " + (a4 ? "A4 landscape" : "A5 portrait") + "; margin: 0; }";
  const pages = [];
  for (let i = 0; i < sheets.length; i += a4 ? 2 : 1) pages.push(el("div", "page" + (a4 ? " a4" : ""), ...sheets.slice(i, i + (a4 ? 2 : 1))));
  $("pages").replaceChildren(...pages);
}
for (const id of ["kind", "seat", "tables", "paper"]) $(id).addEventListener("input", draw);
draw();
</script>
</body>
</html>
