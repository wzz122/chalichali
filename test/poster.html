<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>茶里茶里 モバイルオーダー 二维码</title>
<style id="pagesize">@page { size: A5 portrait; margin: 0; }</style>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #E9ECE9; color: #1F2A24; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "PingFang SC", "Noto Sans JP", "Noto Sans SC", sans-serif; }
  .tools { max-width: 297mm; margin: 16px auto; padding: 0 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 15px; }
  .tools input { width: 90px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid rgba(0, 0, 0, 0.15); font: inherit; }
  .tools button { padding: 9px 16px; border-radius: 10px; border: 0; background: #2E7D4F; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
  .tools select { padding: 8px 10px; border-radius: 10px; border: 1.5px solid rgba(0, 0, 0, 0.15); font: inherit; }
  .tools label { display: flex; gap: 6px; align-items: center; }
  .tools span { color: #6B746F; font-size: 13px; flex-basis: 100%; }
  .pages { overflow-x: auto; padding: 0 16px 24px; }   /* 屏幕比 A4 窄时可以左右滑，不会切掉左边 */
  .page { display: flex; width: fit-content; margin: 0 auto 24px; background: #fff; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12); }
  .page.a4 .sheet + .sheet { border-left: 0.3mm dashed #C9CFCB; }   /* A4 横放两张，中间是剪开的线 */
  /* A4 竖放四张（2×2，每张 A6 大小）：整张牌子按比例缩到 0.707，虚线是剪开的线 */
  .page.a4x4 { display: grid; grid-template-columns: repeat(2, 105mm); grid-template-rows: repeat(2, 148.5mm); }
  .page.a4x4 .sheet { zoom: 0.7071; }
  .page.a4x4 .sheet:nth-child(odd) { border-right: 0.4mm dashed #C9CFCB; }
  .page.a4x4 .sheet:nth-child(-n+2) { border-bottom: 0.4mm dashed #C9CFCB; }

  .sheet {
    width: 148mm; height: 210mm; background: #fff; padding: 11mm 11mm 8mm;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .brand { font-size: 12mm; font-weight: 900; color: #2E7D4F; letter-spacing: 1mm; line-height: 1.1; }
  .title { margin-top: 1.5mm; font-size: 7.5mm; font-weight: 900; }
  .title small { display: block; font-size: 4.4mm; font-weight: 700; color: #6B746F; margin-top: 0.5mm; }
  .where { margin-top: 5mm; width: 100%; border-radius: 4mm; padding: 2.5mm 4mm; color: #fff; background: #2E7D4F; }
  .where b { display: block; font-size: 7.5mm; font-weight: 900; line-height: 1.2; }
  .where small { display: block; font-size: 3.8mm; font-weight: 700; opacity: 0.95; line-height: 1.35; }
  .sheet.takeOut .where { background: #E07B39; }
  .sheet.takeOut .qr { border-color: #E07B39; }
  .queue { margin-top: 2mm; background: #FFF1C2; color: #7A5B00; border-radius: 3mm; padding: 1.5mm 5mm; font-size: 4mm; font-weight: 900; line-height: 1.35; }
  .queue small { display: block; font-size: 3mm; font-weight: 700; }
  .qr { margin-top: 6mm; width: 84mm; height: 84mm; padding: 3mm; border: 1.2mm solid #2E7D4F; border-radius: 6mm; flex: none; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .how { margin-top: 6mm; font-size: 4.6mm; font-weight: 800; line-height: 1.4; }
  .how small { display: block; margin-top: 1mm; font-size: 3.6mm; font-weight: 700; color: #6B746F; }
  /* 二维码上面的宣传语（「一个码」用）：黑白打印也清楚 */
  .cta { margin-top: 5mm; width: 100%; border: 0.8mm solid #1F2A24; border-radius: 4mm; padding: 2.5mm 3mm; }
  .cta b { display: block; font-size: 7.6mm; font-weight: 900; line-height: 1.25; }
  .cta small { display: block; margin-top: 0.8mm; font-size: 4.2mm; font-weight: 800; color: #333; }
  .testmark { margin-top: 2mm; font-size: 3.6mm; font-weight: 900; color: #C62828; border: 0.5mm solid #C62828; border-radius: 2mm; padding: 0.5mm 3mm; }
  .url { margin-top: auto; font-size: 2.6mm; color: #9AA19D; word-break: break-all; }
  @media print {
    html, body { background: #fff; }
    .tools { display: none; }
    .pages { padding: 0; overflow: visible; }
    .page { box-shadow: none; margin: 0; break-after: page; }
    .page:last-child { break-after: auto; }
  }
</style>
</head>
<body>
<div class="tools">
  <select id="kind">
    <option value="single">一个码（堂食、打包都扫这个）</option>
    <option value="set">一整套：桌子 + 前台（每张桌子一个码）</option>
    <option value="table">一张桌子</option>
    <option value="counter">前台（外带，做好来取）</option>
    <option value="queue">排队用（外带）</option>
  </select>
  <label id="seatBox">桌号 <input id="seat" maxlength="10"></label>
  <label id="tablesBox">桌子数 <input id="tables" type="number" min="1" max="30"></label>
  <label id="notestBox"><input type="checkbox" id="notest"> 不印「测试用」</label>
  <select id="paper"><option value="a4x4">A4 竖放，一张印四份（剪开）</option><option value="a4">A4 横放，一张印两份（剪开）</option><option value="a5">A5，一张一份</option></select>
  <button onclick="window.print()">打印</button>
  <span>「一个码」：全店贴同一个码，顾客打开后先选堂食还是打包（默认，一张 A4 印 4 张同样的）。「一整套」：每张桌子一个带桌号的码 + 前台的码。桌子上的二维码带桌号：顾客点的是「店内」，接单屏上写「店内 · 桌 1」，Waiter 里点「テーブル 1」。前台的二维码不带桌号：点的是「外带」，做好到柜台取。打印时选「实际大小 / 100%」。</span>
</div>
<div class="pages" id="pages"></div>

<script src="config.js?v=20261101001823"></script>
<script src="vendor/qrcode.js?v=20261101001823"></script>
<script>
"use strict";
const CONFIG = window.CHALI_CONFIG || {};
const params = new URLSearchParams(location.search);
// 顾客页面地址：config.js 里写了 orderUrl 就用它，否则用和这个页面同一个目录
const BASE = CONFIG.orderUrl || new URL("./", location.href).href;
// 测试网址的二维码打开的是测试点单页：海报上标出来，免得和正式的混在一起
const TEST = /\/test\/$/.test(new URL(BASE).pathname);
const $ = (id) => document.getElementById(id);

$("kind").value = ["single", "set", "table", "counter", "queue"].includes(params.get("k")) ? params.get("k") : params.get("t") ? "table" : "single";
$("seat").value = params.get("t") || "1";
$("tables").value = params.get("n") || CONFIG.tables || 3;
$("paper").value = ["a4", "a5"].includes(params.get("paper")) ? params.get("paper") : "a4x4";
$("notest").checked = params.get("notest") === "1";

function el(tag, cls, ...children) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const c of children) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}

// 一张海报：seat 有值 = 桌子（店内），没有 = 前台（外带）；queue = 排队的地方；
// single = 全店一个码（不带桌号，顾客打开后自己选堂食还是打包）
function sheet(seat, queue, single) {
  const url = new URL(BASE);
  if (seat) url.searchParams.set("t", seat);
  const qr = qrcode(0, "M");
  qr.addData(url.href);
  qr.make();
  const qrBox = el("div", "qr");
  qrBox.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });

  // 牌子上只写日文、简体中文、英文（顾客页面里另有 6 种语言可选）
  const where = single
    ? el("div", "where", el("b", null, "店内・お持ち帰り OK"),
        el("small", null, "堂食、打包都扫这个 · Eat in or take out"))
    : seat
    ? el("div", "where", el("b", null, "テーブル " + seat + " · 桌 " + seat + " · Table " + seat),
        el("small", null, "店内 · Eat in"))
    : el("div", "where", el("b", null, "お持ち帰り · 外带 · Take out"),
        el("small", null, "できあがったらカウンターへ · 做好后到柜台取 · Pick up at the counter"));
  return el("div", "sheet " + (seat || single ? "eatIn" : "takeOut"),
    el("div", "brand", "茶里茶里"),
    el("div", "title", "モバイルオーダー", el("small", null, "扫码点单 · Mobile Order")),
    where,
    single ? el("div", "cta", el("b", null, "本日よりスマホで注文できます！"), el("small", null, "从今天开始可以扫码点单！ · Order on your phone!")) : null,
    queue ? el("div", "queue", "並んでいる間にスマホで注文できます", el("small", null, "排队时可以先扫码点单 · Order on your phone while you wait")) : null,
    qrBox,
    el("div", "how", "ご注文後、レジで番号を伝えてお支払いください", el("small", null, "下单后到柜台报单号付款 · Order, then pay at the counter")),
    TEST && !$("notest").checked ? el("div", "testmark", "测试用 · TEST") : null,
    TEST && $("notest").checked ? null : el("div", "url", url.href),   // 不印「测试用」时网址也不印（网址里有 test）
  );
}

function draw() {
  const kind = $("kind").value;
  // 纸：一页放几张、页面大小
  const paper = { a4x4: [4, "A4 portrait"], a4: [2, "A4 landscape"], a5: [1, "A5 portrait"] }[$("paper").value];
  const per = paper[0];
  $("seatBox").hidden = kind !== "table";
  $("notestBox").hidden = !TEST;
  $("tablesBox").hidden = kind !== "set";
  let sheets;
  if (kind === "single") {
    sheets = Array.from({ length: per }, () => sheet("", false, true));   // 一页印满同一个码
  } else if (kind === "set") {
    const n = Math.max(1, Math.min(30, parseInt($("tables").value, 10) || 3));
    sheets = Array.from({ length: n }, (_, i) => sheet(String(i + 1))).concat(sheet(""));
  } else if (kind === "table") {
    sheets = [sheet($("seat").value.trim() || "1")];
  } else {
    sheets = [sheet("", kind === "queue")];
  }
  $("pagesize").textContent = "@page { size: " + paper[1] + "; margin: 0; }";
  const pages = [];
  for (let i = 0; i < sheets.length; i += per) pages.push(el("div", "page " + $("paper").value, ...sheets.slice(i, i + per)));
  $("pages").replaceChildren(...pages);
}
for (const id of ["kind", "seat", "tables", "paper", "notest"]) $(id).addEventListener("input", draw);
draw();
</script>
</body>
</html>
